apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: tax-calculator-pipeline-run
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: image-tag
      value: "latest"
  workspaces:
    - name: pipeline-workspace
      persistentVolumeClaim:
        claimName: tekton-pvc