<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>tax-calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-card">
    <h2>tax-calculator</h2>
    <div class="form-group">
      <label for="income">Your Total Income ($)</label>
      <input type="number" id="income" placeholder="100000" value="100000">
    </div>
    <div class="form-group">
      <label for="deductions">Deductions ($)</label>
      <input type="number" id="deductions" placeholder="50000" value="50000">
    </div>
    <button id="calcBtn" onclick="calculateAndDisplayTax()">Calculate Tax</button>
    
    <div id="result" class="result-box">
      <p>Calculated Taxable Income: <strong id="taxableOutput">$50,000</strong></p>
      <p>Tax Due: <strong id="taxOutput">$7,500</strong></p>
    </div>
  </div>

  <script src="taxCalculator.js"></script>
  <script src="script.js"></script>
</body>
</html>
